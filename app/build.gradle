plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'ma.ab.autoclicker'
    compileSdk 34

    defaultConfig {
        applicationId 'ma.ab.autoclicker'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            // كيتوقّع بمفتاح debug باش الـ APK يتثبّت مباشرة فالتليفون
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

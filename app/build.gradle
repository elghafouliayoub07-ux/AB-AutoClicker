plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'ma.ab.autoclicker'
    compileSdk 34

    defaultConfig {
        applicationId 'ma.ab.autoclicker'
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName '1.9'
    }

    // مفتاح توقيع ثابت: باش كل نسخة جديدة تتثبت فوق القديمة بلا مشكل
    signingConfigs {
        fixed {
            storeFile file('ab-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
